webserverPort: 8080

https:
  enabled: false
  port: 8443
  certFile: server.crt
  keyFile: server.key

logLevel: info

jsonExporter:
  enabled: true

prometheusExporter:
  enabled: true

influxDbExporter:
  enabled: false
  server: 1.2.3.4
  port: 8086
  org: <org>
  token: <token> or <username>:<password>
  database: <database(bucket)>
  measurement: <measurement>

mqtt:
  enabled: false
  brokerAddress: 1.2.3.4
  brokerPort: 1883
  username: username
  password: password
  clientId: weather-exporter
  topicPrefix: weather
